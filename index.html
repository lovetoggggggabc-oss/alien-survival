<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#11192d">
  <title>낯선 별의 밤 — 외계 생존</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#f1f5ee;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}#game{display:block;width:100vw;height:100dvh;image-rendering:pixelated;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none}.panel,button,.modal{border:2px solid #718e91;border-radius:7px;background:#14243de9;box-shadow:0 4px 0 #080f21,0 7px 22px #03081777}#top{position:absolute;top:calc(env(safe-area-inset-top) + 9px);left:9px;right:9px;display:flex;align-items:flex-start;gap:6px;pointer-events:auto}#clock,#materials{padding:7px 10px;font-weight:800;text-shadow:1px 2px #0b1120;font-size:12px;min-height:36px}#clock{color:#ffe3aa;white-space:nowrap}#materials{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c7e2df}#top button{min-height:38px;padding:5px 10px;font-size:13px;font-weight:800}#top button:first-of-type{background:#37546b}#notice{position:absolute;top:calc(env(safe-area-inset-top) + 55px);left:10px;max-width:75%;padding:7px 10px;font-size:12px;line-height:1.35;background:#102039ce;border-left:3px solid #adcea6;text-shadow:1px 1px #101827}#toast{position:absolute;top:calc(env(safe-area-inset-top) + 94px);left:50%;transform:translateX(-50%);width:max-content;max-width:86%;padding:7px 12px;border-radius:5px;background:#24344eea;color:#fff;opacity:0;transition:opacity .2s;text-align:center;font-size:12px;pointer-events:none}#toast.show{opacity:1}#status{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 168px);left:50%;transform:translateX(-50%);max-width:min(90%,480px);padding:7px 10px;text-align:center;font-size:12px;line-height:1.3;pointer-events:none}#controls{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 68px);height:112px;pointer-events:none}#joystick{position:absolute;left:15px;bottom:0;width:110px;height:110px;border:3px solid #759daa;border-radius:50%;background:#172943b9;box-shadow:inset 0 0 20px #a3d3c426;touch-action:none;pointer-events:auto}#stick{position:absolute;left:32px;top:32px;width:40px;height:40px;border:2px solid #b1d3cc;border-radius:50%;background:#5d8794;box-shadow:0 3px 0 #254351;pointer-events:none}#actions{position:absolute;right:12px;bottom:4px;display:flex;align-items:flex-end;gap:7px;pointer-events:auto}#actions button{width:60px;height:60px;padding:3px;font-weight:900;font-size:12px;line-height:1.3;touch-action:none}#actions button span{display:block;font-size:23px}#actions button:active,.tool:active{transform:translateY(3px)}#actions .jump{height:73px;background:#355778}#toolbar{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 6px);left:8px;right:8px;display:flex;justify-content:center;gap:6px;pointer-events:auto}#toolbar button{flex:1;max-width:145px;min-height:50px;font-size:13px;font-weight:800;padding:5px 3px}#toolbar button.active{background:#5a5440;border-color:#e1c887}#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#060c19b8;pointer-events:auto}#overlay.open{display:flex}.modal{width:min(92vw,480px);max-height:min(78dvh,670px);display:flex;flex-direction:column;overflow:hidden;padding:16px;background:#16243a;border-color:#9ab3b4}.modal header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #557080;padding-bottom:9px}.modal h2{margin:0;font-size:20px;color:#ffe3a6}.modal header button{font-size:20px;min-width:38px;min-height:38px}.modal-body{overflow-y:auto;overscroll-behavior:contain;padding-top:12px}.modal h3{font-size:14px;color:#b5dacd;margin:14px 0 7px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.slot{padding:10px 3px;min-height:70px;background:#263e54;border:2px solid #5d7d85;border-radius:5px;text-align:center;font-size:12px}.slot strong{display:block;font-size:22px}.recipe{border:1px solid #607d87;background:#20364c;border-radius:6px;padding:10px;margin:7px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}.recipe b{display:block;color:#f6dfad}.recipe small{display:block;color:#bfd0d4;margin-top:3px;line-height:1.4}.recipe button{padding:8px 10px;min-width:65px;font-size:12px;white-space:nowrap}.recipe button:disabled{opacity:.48}.hint{color:#b6c9d0;font-size:12px;line-height:1.5}
    @media(max-width:600px){#top{flex-wrap:wrap}#clock{flex:1}#materials{order:3;flex-basis:100%;font-size:11px;min-height:30px;padding:5px 8px}#notice{top:calc(env(safe-area-inset-top) + 83px);font-size:11px;max-width:68%}#toast{top:calc(env(safe-area-inset-top) + 115px)}#status{bottom:calc(env(safe-area-inset-bottom) + 188px);font-size:11px}#controls{bottom:calc(env(safe-area-inset-bottom) + 78px)}#joystick{left:12px;width:108px;height:108px}#actions{right:8px;gap:5px}#actions button{width:55px;height:58px}#actions .jump{height:69px}#toolbar{bottom:calc(env(safe-area-inset-bottom) + 8px)}#toolbar button{min-height:53px}}
    @media(max-width:365px){#actions button{width:49px}#actions button span{font-size:20px}#joystick{width:96px;height:96px}#stick{left:26px;top:26px}#toolbar button{font-size:12px}}
  </style>
</head>
<body>
  <canvas id="game" aria-label="외계 행성 게임 화면"></canvas>
  <div id="hud">
    <div id="top"><div class="panel" id="clock"></div><button id="bag">🎒 가방</button><button id="speed">×1</button><div class="panel" id="materials"></div></div>
    <div id="notice">왼쪽 조이스틱 이동 · 아래로 밀며 채집하면 땅을 팝니다</div>
    <div id="toast"></div><div class="panel" id="status"></div>
    <div id="controls"><div id="joystick"><div id="stick"></div></div><div id="actions"><button id="mine"><span>⛏</span>채집</button><button id="attack"><span>⚔</span>공격</button><button id="jump" class="jump"><span>↑</span>점프</button></div></div>
    <div id="toolbar"><button id="build">▣ 설계도</button><button id="craft">⚙ 제작</button><button id="allies">✦ 동료</button><button id="save">▤ 저장</button></div>
    <div id="overlay"><div class="modal"><header><h2 id="modal-title"></h2><button id="close" aria-label="닫기">×</button></header><div id="modal-body" class="modal-body"></div></div></div>
  </div>
  <script src="game.js?v=20260923-inventory-underground"></script>
</body>
</html>
