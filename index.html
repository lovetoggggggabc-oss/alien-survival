  <style>

    @media(max-width:365px){#actions button{width:49px}#actions button span{font-size:20px}#joystick{width:96px;height:96px}#stick{left:26px;top:26px}#toolbar button{font-size:12px}}
    :root{--joy-size:108px}#joystick{width:var(--joy-size)!important;height:var(--joy-size)!important}#stick{left:calc(50% - 20px)!important;top:calc(50% - 20px)!important}#controls{height:max(112px,var(--joy-size))}#status{bottom:calc(env(safe-area-inset-bottom) + max(188px, var(--joy-size) + 87px))}#cancel-mode{position:absolute;bottom:calc(env(safe-area-inset-bottom) + max(190px,var(--joy-size) + 92px));right:12px;padding:6px 9px;font-size:12px;pointer-events:auto;display:none}.inventory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.inventory-slot{display:flex;align-items:center;gap:9px;background:#263e54;border:2px solid #5d7d85;border-radius:6px;padding:8px;min-height:58px}.inventory-slot .icon{font-size:24px;width:28px;text-align:center}.inventory-slot .item-name{font-weight:700;font-size:13px}.inventory-slot .item-count{display:block;color:#c3d4d3;font-size:12px}.inventory-slot button{margin-left:auto;font-size:11px;padding:6px;min-width:46px}.equipment-list{display:grid;gap:6px}.equipment-list .inventory-slot{min-height:52px}.equipment-list button:disabled{opacity:.7;background:#305b57;border-color:#8cbbb1}.section-note{color:#a8c4c5;font-size:12px;margin:3px 0 9px}.settings-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #4e6977}.settings-row input{width:55%;accent-color:#91c8c2}.settings-row button{padding:7px 12px}.badge{color:#f6dfa7;font-weight:800}#toolbar button{max-width:155px}#minimap{position:absolute;top:calc(env(safe-area-inset-top) + 59px);right:9px;width:180px;height:100px;image-rendering:pixelated;border:2px solid #91b4b5;border-radius:6px;background:#19283cdb;box-shadow:0 4px 0 #091422;pointer-events:auto}#map-caption{position:absolute;top:calc(env(safe-area-inset-top) + 161px);right:10px;background:#15243ccf;color:#c8e5da;border-radius:4px;padding:2px 5px;font-size:10px}@media(max-width:600px){#toolbar button{font-size:11px;padding:5px 1px}#materials{font-size:10px}#top button{padding:5px 8px}#minimap{top:calc(env(safe-area-inset-top) + 119px);width:138px;height:79px}#map-caption{top:calc(env(safe-area-inset-top) + 200px)}#notice{max-width:calc(100% - 165px)}}
    #joystick{left:20px!important;bottom:8px!important}#coordinates{position:absolute;top:calc(env(safe-area-inset-top) + 87px);left:10px;padding:5px 8px;color:#e5f3db;font-size:12px;font-weight:800;letter-spacing:.3px;text-shadow:1px 1px #0b1926;background:#20364bcc;border-left:3px solid #9dc5ae}#awards{border-color:#d5bc7a!important;color:#ffe4a4!important}.bag-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;padding:7px;background:#101b2c;border:3px solid #758f9a;border-radius:5px}.bag-cell{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;aspect-ratio:1;border:2px solid #455d6c;border-radius:2px;background:#2b3d4d;box-shadow:inset 0 2px 3px #152331;cursor:pointer;padding:0}.bag-cell.selected{border-color:#f2d28d;background:#4d5d56;box-shadow:inset 0 0 0 1px #d4b875}.bag-cell.empty{opacity:.52}.bag-icon{font-size:clamp(13px,4.5vw,22px);line-height:1}.bag-qty{position:absolute;right:1px;bottom:0;font-size:10px;font-weight:900;text-shadow:1px 1px #0a1420}.gear-slots{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.gear-slots>div{display:flex;flex-direction:column;padding:7px;background:#283d4d;border:1px solid #668087;border-radius:3px;font-size:11px}.gear-slots b{color:#f1dcaf;font-size:12px}.bag-detail{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-top:10px;padding:11px;background:#243b4b;border:2px solid #719496;border-radius:4px}.bag-detail small{display:block;color:#bed4d0;line-height:1.45}.bag-detail button{font-size:12px;padding:7px;white-space:nowrap}.bag-detail button:disabled{opacity:.6}.award-list{display:grid;gap:7px}.award{display:flex;align-items:center;gap:10px;padding:9px;background:#233445;border:1px solid #5d7180;border-radius:4px;opacity:.7}.award.earned{background:#443e37;border-color:#d8bb7b;opacity:1}.award-icon{font-size:23px}.award b,.award small{display:block}.award small{color:#bfced1;font-size:11px}.award strong{margin-left:auto;white-space:no </head>
<body>
  <canvas id="game" aria-label="외계 행성 게임 화면"></canvas>
  <div id="hud">
    <div id="top"><div class="panel" id="clock"></div><button id="bag">🎒 가방</button><button id="awards">🏆 0</button><button id="speed">×1</button><button id="settings" aria-label="설정">⚙</button><div class="panel" id="materials"></div></div>
    <div class="panel" id="coordinates" aria-label="시작점 기준 좌표">⌖ X 0 · Y 0</div>
    <div id="notice">왼쪽 조이스틱 이동 · 아래로 밀며 채집하면 땅을 팝니다</div>
    <canvas id="minimap" width="180" height="100" aria-label="산, 언덕, 동굴과 현재 위치를 표시하는 지도"></canvas><div id="map-caption">지도 · 흰 점: 내 위치</div>
    <div id="toast"></div><div class="panel" id="status"></div><button id="cancel-mode">선택 취소</button>
    <div id="controls"><div id="joystick"><div id="stick"></div></div><div id="actions"><button id="mine"><span>⛏</span>채집</button><button id="attack"><span>⚔</span>공격</button><button id="jump" class="jump"><span>↑</span>점프</button></div></div>
    <div id="toolbar"><button id="drafting">⌑ 설계도 제작</button><button id="build">▣ 설계도</button><button id="craft">⚙ 아이템 제작</button><button id="allies">✦ 동료</button></div>
    <div id="overlay"><div class="modal"><header><h2 id="modal-title"></h2><button id="close" aria-label="닫기">×</button></header><div id="modal-body" class="modal-body"></div></div></div>
  </div>
  <script src="game.js?v=20260923-achievements-inventory-coordinates"></script>
