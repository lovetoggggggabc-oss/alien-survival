<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>낯선 별의 밤 — 생존 시제품</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf7ff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer;touch-action:none}canvas{touch-action:none}#game{width:100vw;height:100dvh;display:block;image-rendering:pixelated}#hud{position:absolute;inset:0;pointer-events:none}#top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}#top .box,#help,#status,#bar,#touch,.modal{background:#111b32d9;border:2px solid #718fa4;box-shadow:0 4px 0 #060a14,0 0 24px #0008;border-radius:5px}.box{padding:8px 12px;font-weight:800;text-shadow:1px 2px #000}#clock{color:#e8d88a}#inv{font-size:13px;line-height:1.6}#help{position:absolute;left:12px;top:89px;padding:7px 10px;font-size:12px;max-width:355px;line-height:1.5}#status{position:absolute;bottom:118px;left:50%;transform:translateX(-50%);padding:7px 12px;min-width:220px;text-align:center;font-size:13px}#bar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:7px;pointer-events:auto;max-width:calc(100% - 20px);overflow-x:auto}#bar button,.modal button,#touch button,#speed{background:#233a52;border:2px solid #769aaa;border-bottom:4px solid #405e6d;border-radius:4px;padding:8px 10px;white-space:nowrap;font-weight:bold;font-size:12px}#bar button.active{background:#62513c;border-color:#e8cb8a}#bar button:active,#touch button:active{transform:translateY(2px)}#speed{pointer-events:auto}#touch{position:absolute;bottom:124px;right:12px;display:flex;gap:8px;padding:6px;pointer-events:auto}#touch button{font-size:20px;min-width:48px}#modal{position:absolute;inset:0;display:none;place-items:center;background:#050914bc;pointer-events:auto}.modal{max-width:420px;width:calc(100% - 32px);padding:22px;line-height:1.6}.modal h2{margin:0 0 8px;color:#ffe3a0}.modal p{font-size:14px}.modal button{margin:4px}.hint{color:#a9c4ce}#toast{position:absolute;top:166px;left:50%;transform:translateX(-50%);background:#202f46e8;padding:8px 14px;border:1px solid #99bbca;border-radius:4px;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}#toast.show{opacity:1}@media(max-width:650px){#top{top:6px;left:6px;right:6px;flex-wrap:wrap}.box{font-size:12px;padding:5px 7px}#inv{order:3;width:100%;font-size:11px}#help{top:91px;left:6px;font-size:10px;max-width:240px}#status{bottom:137px;left:6px;transform:none;min-width:0;max-width:55%;font-size:11px}#touch{bottom:108px;right:6px}#touch button{min-width:54px;min-height:54px}#bar{bottom:5px;width:calc(100% - 12px);scrollbar-width:none}#bar::-webkit-scrollbar{display:none}#bar button{font-size:11px;padding:9px;min-height:52px}}
</style></head><body><canvas id="game"></canvas><div id="hud"><div id="top"><div class="box" id="clock"></div><div class="box" id="inv"></div><button id="speed">시간 ×1</button></div><div id="help">A/D 이동 · E 채집/재료 넣기 · F 공격<br>설계도 선택 → 지면 클릭 → 재료 운반 → 완성</div><div id="toast"></div><div id="status"></div><div id="touch"><button data-key="left">◀</button><button data-key="right">▶</button><button data-key="act">⛏</button><button data-key="attack">⚔</button></div><div id="bar"><button data-tool="mine">⛏ 채집</button><button data-tool="bed">🛏 침대 설계도</button><button data-tool="farm">🌱 농장 설계도</button><button data-tool="wall">▣ 방벽 설계도</button><button data-tool="recruit">✦ 동료 모집</button><button data-tool="assign">⚙ 동료 역할</button><button data-tool="save">💾 저장</button></div><div id="modal"><div class="modal"><h2 id="mt"></h2><div id="mc"></div><button id="close">닫기</button></div></div></div><script src="game.js"></script></body></html>
